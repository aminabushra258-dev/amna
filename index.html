<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Nexora | Future Technology</title>

    <link rel="stylesheet"
        href="./output.css">

</head>

<body class="bg-slate-950 text-white">

    <!-- Components -->

    <div id="navbar"></div>

    <main>

        <div id="hero"></div>

        <div id="features"></div>

        <div id="bento"></div>

        <div id="stats"></div>

        <div id="cta"></div>

        <div id="contact"></div>

    </main>

    <div id="footer"></div>


    <!-- Component Loader -->

    <script>

        const components = {
            navbar: "./navbar.html",
            hero: "./hero.html",
            features: "./features.html",
            bento: "./bento.html",
            stats: "./stats.html",
            cta: "./cta.html",
            contact: "./contact.html",
            footer: "./footer.html"
        };


        async function loadComponent(id, file) {

            try {

                const response = await fetch(file);

                if (!response.ok) {
                    throw new Error("Could not load " + file);
                }

                const html = await response.text();

                document.getElementById(id).innerHTML = html;

            } catch (error) {

                console.error(error);

            }

        }


        async function loadWebsite() {

            for (const [id, file] of Object.entries(components)) {

                await loadComponent(id, file);

            }

        }


        loadWebsite();

    </script>

</body>

</html>
