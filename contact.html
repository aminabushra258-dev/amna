<section id="contact"
    class="relative overflow-hidden bg-slate-950 px-6 py-24 sm:py-32">

    <div class="absolute -left-40 top-20 h-80 w-80 rounded-full
        bg-cyan-500/10 blur-3xl animate-pulse">
    </div>

    <div class="absolute -right-40 bottom-20 h-80 w-80 rounded-full
        bg-purple-500/10 blur-3xl animate-pulse">
    </div>


    <div class="relative mx-auto max-w-7xl">

        <div class="mx-auto max-w-2xl text-center">

            <p class="text-sm font-bold uppercase tracking-[0.4em]
                text-cyan-400">
                Contact Nexora
            </p>

            <h2 class="mt-4 text-4xl font-black text-white sm:text-6xl">
                Let's build the future.
            </h2>

            <p class="mt-5 text-lg text-slate-400">
                Have an idea or want to learn more?
                We'd love to hear from you.
            </p>

        </div>


        <div class="mx-auto mt-16 grid max-w-5xl gap-10 lg:grid-cols-2">


            <!-- Contact Info -->

            <div class="rounded-3xl border border-white/10
                bg-white/5 p-8 backdrop-blur
                transition duration-500
                hover:-translate-y-2
                hover:border-cyan-400/40">

                <h3 class="text-3xl font-bold text-white">
                    Get in touch
                </h3>

                <p class="mt-4 leading-7 text-slate-400">
                    Connect with Nexora and discover new possibilities
                    through technology and innovation.
                </p>


                <div class="mt-10 space-y-7">

                    <div class="flex items-center gap-4">

                        <div class="flex h-12 w-12 items-center
                            justify-center rounded-xl
                            bg-cyan-400/10 text-xl text-cyan-400">
                            ✉
                        </div>

                        <div>
                            <p class="text-sm text-slate-500">
                                Email
                            </p>

                            <p class="text-white">
                                hello@nexora.dev
                            </p>
                        </div>

                    </div>


                    <div class="flex items-center gap-4">

                        <div class="flex h-12 w-12 items-center
                            justify-center rounded-xl
                            bg-purple-400/10 text-xl text-purple-400">
                            ◎
                        </div>

                        <div>
                            <p class="text-sm text-slate-500">
                                Location
                            </p>

                            <p class="text-white">
                                Digital World
                            </p>
                        </div>

                    </div>

                </div>

            </div>


            <!-- Form -->

            <form
                class="rounded-3xl border border-white/10
                bg-white/5 p-8 backdrop-blur
                transition duration-500 hover:border-cyan-400/30">


                <div>

                    <label class="text-sm font-medium text-slate-300">
                        Name
                    </label>

                    <input type="text"
                        placeholder="Your name"
                        class="mt-2 w-full rounded-xl
                        border border-white/10 bg-slate-950
                        px-4 py-3 text-white outline-none
                        placeholder:text-slate-500
                        transition duration-300
                        focus:border-cyan-400
                        focus:shadow-[0_0_25px_rgba(34,211,238,0.2)]">

                </div>


                <div class="mt-6">

                    <label class="text-sm font-medium text-slate-300">
                        Email
                    </label>

                    <input type="email"
                        placeholder="you@example.com"
                        class="mt-2 w-full rounded-xl
                        border border-white/10 bg-slate-950
                        px-4 py-3 text-white outline-none
                        placeholder:text-slate-500
                        transition duration-300
                        focus:border-purple-400
                        focus:shadow-[0_0_25px_rgba(168,85,247,0.2)]">

                </div>


                <div class="mt-6">

                    <label class="text-sm font-medium text-slate-300">
                        Message
                    </label>

                    <textarea rows="5"
                        placeholder="Tell us about your idea..."
                        class="mt-2 w-full resize-none rounded-xl
                        border border-white/10 bg-slate-950
                        px-4 py-3 text-white outline-none
                        placeholder:text-slate-500
                        transition duration-300
                        focus:border-cyan-400
                        focus:shadow-[0_0_25px_rgba(34,211,238,0.2)]"></textarea>

                </div>


                <button type="submit"
                    class="mt-6 w-full rounded-xl bg-cyan-400
                    py-4 font-bold text-slate-950
                    transition duration-500
                    hover:-translate-y-1 hover:bg-cyan-300
                    hover:shadow-[0_0_40px_rgba(34,211,238,0.35)]">

                    Send Message →

                </button>

            </form>

        </div>

    </div>

</section>
