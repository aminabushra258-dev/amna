<section id="home"
    class="relative flex min-h-screen items-center justify-center overflow-hidden bg-slate-950 px-6 pt-24 text-center">

    <!-- Animated Background -->

    <div class="absolute inset-0 overflow-hidden">

        <!-- Gradient -->
        <div class="absolute inset-0 bg-gradient-to-br from-cyan-950 via-purple-950 to-slate-950 bg-[length:300%_300%] animate-gradient">
        </div>

        <!-- Grid -->
        <div class="absolute inset-0 opacity-30
            bg-[linear-gradient(rgba(34,211,238,0.12)_1px,transparent_1px),linear-gradient(90deg,rgba(34,211,238,0.12)_1px,transparent_1px)]
            bg-[size:50px_50px] animate-grid">
        </div>

        <!-- Main Glow -->
        <div class="absolute left-1/2 top-1/2 h-[500px] w-[500px]
            -translate-x-1/2 -translate-y-1/2 rounded-full
            bg-cyan-400/20 blur-[110px] animate-glow">
        </div>

        <!-- Floating Glows -->

        <div class="absolute -left-32 top-20 h-80 w-80 rounded-full
            bg-purple-500/20 blur-[90px] animate-float-one">
        </div>

        <div class="absolute -right-32 bottom-10 h-80 w-80 rounded-full
            bg-pink-500/20 blur-[90px] animate-float-two">
        </div>

        <!-- Rings -->

        <div class="absolute left-1/2 top-1/2 h-[350px] w-[350px]
            -translate-x-1/2 -translate-y-1/2 rounded-full
            border border-cyan-400/30 animate-[spin_12s_linear_infinite]">
        </div>

        <div class="absolute left-1/2 top-1/2 h-[500px] w-[500px]
            -translate-x-1/2 -translate-y-1/2 rounded-full
            border border-purple-400/20 animate-[spin_18s_linear_infinite_reverse]">
        </div>

        <!-- Particles -->

        <div class="absolute left-[12%] top-[25%] h-3 w-3 rounded-full
            bg-cyan-400 shadow-[0_0_25px_rgba(34,211,238,1)]
            animate-particle-one">
        </div>

        <div class="absolute left-[80%] top-[20%] h-2 w-2 rounded-full
            bg-purple-400 shadow-[0_0_25px_rgba(168,85,247,1)]
            animate-particle-two">
        </div>

        <div class="absolute left-[85%] top-[70%] h-3 w-3 rounded-full
            bg-pink-400 shadow-[0_0_25px_rgba(236,72,153,1)]
            animate-particle-three">
        </div>

        <div class="absolute left-[18%] top-[72%] h-2 w-2 rounded-full
            bg-cyan-300 shadow-[0_0_25px_rgba(34,211,238,1)]
            animate-particle-four">
        </div>

    </div>


    <!-- Decorative Orbit -->

    <div class="absolute left-10 top-28 h-28 w-28 rounded-full
        border border-cyan-400/30 animate-[spin_8s_linear_infinite]">

        <span class="absolute -right-1 top-1/2 h-3 w-3 rounded-full
            bg-cyan-400 shadow-[0_0_20px_rgba(34,211,238,1)]">
        </span>

    </div>


    <div class="absolute right-10 bottom-28 h-36 w-36 rounded-full
        border border-purple-400/30 animate-[spin_10s_linear_infinite_reverse]">

        <span class="absolute -left-1 top-1/2 h-3 w-3 rounded-full
            bg-purple-400 shadow-[0_0_20px_rgba(168,85,247,1)]">
        </span>

    </div>


    <!-- Hero Content -->

    <div class="relative z-10 max-w-5xl">

        <p class="mb-6 text-sm font-bold uppercase tracking-[0.5em]
            text-cyan-400 animate-fade-up">
            Future Technology
        </p>

        <h1 class="text-6xl font-black italic tracking-tight text-white
            sm:text-8xl md:text-[9rem] animate-float">

            NEXORA<span class="text-cyan-400">.</span>

        </h1>

        <p class="mx-auto mt-8 max-w-2xl text-lg leading-8 text-slate-300 sm:text-xl">

            Explore the future of technology through
            <span class="font-bold text-cyan-400">innovation</span>,
            <span class="font-bold text-purple-400">creativity</span>
            and intelligent digital experiences.

        </p>


        <!-- Buttons -->

        <div class="mt-10 flex flex-col items-center justify-center gap-5 sm:flex-row">

            <a href="#features"
                class="rounded-full bg-cyan-400 px-9 py-4 font-bold uppercase
                tracking-wider text-slate-950
                shadow-[0_0_40px_rgba(34,211,238,0.4)]
                transition duration-500 hover:-translate-y-2 hover:scale-105
                hover:bg-cyan-300 hover:shadow-[0_0_70px_rgba(34,211,238,0.7)]">

                Explore Nexora →

            </a>

            <a href="#showcase"
                class="rounded-full border border-white/20 px-9 py-4
                font-bold uppercase tracking-wider text-white
                transition duration-500 hover:-translate-y-1 hover:scale-105
                hover:border-cyan-400 hover:bg-white/10">

                Discover More

            </a>

        </div>

    </div>

</section>
